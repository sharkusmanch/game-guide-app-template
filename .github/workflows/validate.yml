name: Shared validation
on:
  workflow_call:
permissions:
  contents: read
jobs:
  browser:
    name: Browser tests, types and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:hosting
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: dist
          retention-days: 1
  runtime:
    name: Docker runtime and ownership
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm run test:runtime
